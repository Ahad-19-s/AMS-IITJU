<!DOCTYPE html>
<html>
<head>
    <title>Smart Academic System</title>
    <style>
        body { font-family: Arial; background-color: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; border-radius: 4px; font-size: 16px;}
        button:hover { background-color: #0056b3; }
        .result { margin-top: 15px; padding: 15px; font-weight: bold; text-align: center; border-radius: 5px;}
        .High { background-color: #f8d7da; color: #721c24; }
        .Medium { background-color: #fff3cd; color: #856404; }
        .Low { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">🎓 AI Risk Predictor</h2>
        <form method="POST">
            {% csrf_token %}
            <label>Attendance (%):</label> <input type="number" name="attendance" required>
            <label>Assignment Score:</label> <input type="number" name="assignment" required>
            <label>Quiz Score:</label> <input type="number" name="quiz" required>
            <label>Midterm Score:</label> <input type="number" name="midterm" required>
            <label>Final Score:</label> <input type="number" name="final" required>
            <label>Previous GPA:</label> <input type="number" step="0.01" name="previous_gpa" required>
            <button type="submit">Predict Risk</button>
        </form>

        {% if prediction %}
            <div class="result {{ prediction }}">
                🎯 AI Prediction: Student is at <b>{{ prediction }}</b> Risk!
            </div>
        {% endif %}
    </div>
</body>
</html>
