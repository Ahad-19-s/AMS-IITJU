<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dropout Predicted System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fc;
        }
        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #781f1f8a 10%, #040f3e 100%);
            color: white;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            padding-top: 20px;
        }
        .sidebar a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            display: block;
            padding: 15px 20px;
            margin: 5px 10px;
            border-radius: 5px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .sidebar a:hover {
            background-color: rgba(255,255,255,0.1);
            color: white;
            transform: translateX(5px);
        }
        .sidebar a.active {
            background-color: white;
            color: #4e73df;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        main {
            padding-top: 20px;
        }
        /* কার্ড ডিজাইন */
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <h4 class="text-center mb-4 text-white fw-bold">
                        <i class="fas fa-graduation-cap"></i> Admin
                    </h4>
                    <hr style="background-color: rgba(255,255,255,0.5);">
                    
                    <div class="nav flex-column">
                        <a href="{% url 'dashboard' %}" class="{% if request.path == '/dashboard/' or request.path == '/' %}active{% endif %}">
                            <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                        </a>
                        <li class="nav-item">
    <a href="{% url 'add_data' %}" class="nav-link text-white">
        <i class="fas fa-plus-circle me-2"></i> Add Data
    </a>
</li>

                        <a href="{% url 'students' %}" class="{% if 'student' in request.path %}active{% endif %}">
                            <i class="fas fa-users me-2"></i> Students List
                        </a>

                        <li class="nav-item">
    <a class="nav-link" href="{% url 'ai_dashboard' %}">
        <i class="fas fa-brain"></i>
        <span>AI Predictor</span>
    </a>
</li>

                        <li class="nav-item">
    <a class="nav-link" href="{% url 'reports' %}">
        <i class="fas fa-fw fa-chart-area"></i>
        <span>Reports</span>
    </a>
</li>
                    </div>

                   

<li class="nav-item">
    <a href="{% url 'admin_settings' %}" class="nav-link text-white">
        <i class="fas fa-cogs me-2"></i> Settings
    </a>
</li>
                    
                    <div class="mt-5 px-3">
                        <hr style="background-color: #aea4a480;">
                        <a href="{% url 'logout' %}" class="btn btn-danger w-100 text-white" style="background-color: #161414; border: none;">
                            <i class="fas fa-sign-out-alt me-2"></i> Logout
                        </a>
                    </div>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
