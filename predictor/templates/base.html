<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academic System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f7f6; }
        .sidebar { height: 100vh; background: #2b3eb1; color: white; padding-top: 20px; position: fixed; width: 16.666667%; }
        .sidebar a { color: #d1d8ff; text-decoration: none; padding: 15px 20px; display: block; font-size: 16px; transition: 0.3s; }
        .sidebar a:hover { background: #1e2c8a; color: white; border-left: 4px solid #fff; }
        .sidebar .active { background: #1e2c8a; color: white; border-left: 4px solid #00ff88; }
        .content { margin-left: 16.666667%; padding: 30px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <h4 class="text-center mb-4 text-white"><i class="fas fa-graduation-cap"></i> EduAdmin</h4>
                <hr style="background-color: white;">
                <a href="/" class="active"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                <a href="/predict"><i class="fas fa-brain me-2"></i> AI Predictor</a>
                <a href="/students"><i class="fas fa-users me-2"></i> Students List</a>
                <a href="/reports"><i class="fas fa-chart-pie me-2"></i> Reports</a>
            </nav>

            <main class="col-md-10 content">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
