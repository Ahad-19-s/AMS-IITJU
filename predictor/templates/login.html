<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Login - EduAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #04276d 0%, #6885bf 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgb(19, 102, 130); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .btn-login { background-color: #4e73df; color: white; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; }
        .btn-login:hover { background-color: #2e59d9; color: white; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">🎓 EduAdmin</h3>
        <p class="text-muted">Teacher Portal Login</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-muted fw-bold small">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-login">Login to Dashboard</button>
    </form>
</div>

</body>
</html>
